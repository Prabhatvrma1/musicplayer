<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0b0709">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>चटपटे गाने</title>
    <meta name="description" content="चटपटे गाने — Bollywood party bangers on Spotify">
    <link rel="icon" type="image/png" href="assets/images/panipuri.png">
    <link rel="apple-touch-icon" href="assets/images/panipuri.png">
    <meta property="og:title" content="चटपटे गाने">
    <meta property="og:description" content="Bollywood party bangers">
    <meta name="referrer" content="no-referrer">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <!-- Responsive Image Background Scene (desk.jpg on desktop, phone.png on mobile) -->
    <div class="scene-container">
        <picture class="scene-bg-picture">
            <source media="(max-width: 640px)" srcset="assets/images/phone.png">
            <img class="scene-bg" src="assets/images/desk.jpg" alt="चटपटे गाने" loading="eager" decoding="async" draggable="false">
        </picture>

        <!-- Ambient Lighting Overlay -->
        <div class="scene-overlay"></div>

        <!-- Top Nav Bar (exact saloon.wtf layout) -->
        <header class="top-nav">
            <!-- Left: Live Clock (fixed left-5 top-5) -->
            <div class="top-clock" id="topClock">8:08 pm</div>

            <!-- Center: Live Online Status Indicator (fixed left-1/2 top-5 -translate-x-1/2) -->
            <div class="top-online" aria-live="polite">
                <span class="online-indicator">
                    <span class="ping"></span>
                    <span class="dot"></span>
                </span>
                <span class="online-count" id="onlineCount">30</span>
                <span class="online-text">online</span>
            </div>

            <!-- Right: Action Links (fixed right-5 top-5) -->
            <div class="top-right-actions">
                <a href="https://open.spotify.com/playlist/1DatcBStkkmYNY6KKvPbv4" target="_blank" rel="noopener noreferrer" class="nav-link-btn" aria-label="Open on Spotify">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="white" aria-hidden="true">
                        <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.42 1.56-.299.421-1.02.599-1.559.3z"/>
                    </svg>
                    <span class="nav-label">Spotify</span>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="external-arrow" aria-hidden="true">
                        <path d="M5 12h14M13 6l6 6-6 6"/>
                    </svg>
                </a>

                <a href="https://music.youtube.com/playlist?list=PLTJ1PnzCWyFw" target="_blank" rel="noopener noreferrer" class="nav-link-btn" aria-label="Open on YouTube Music">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="white" aria-hidden="true">
                        <path d="M12 0C5.376 0 0 5.376 0 12s5.376 12 12 12 12-5.376 12-12S18.624 0 12 0zm0 19.104c-3.924 0-7.104-3.18-7.104-7.104S8.076 4.896 12 4.896s7.104 3.18 7.104 7.104-3.18 7.104-7.104 7.104zm0-13.332c-3.432 0-6.228 2.796-6.228 6.228S8.568 18.228 12 18.228s6.228-2.796 6.228-6.228S15.432 5.772 12 5.772zM9.684 15.54V8.46L15.816 12l-6.132 3.54z"/>
                    </svg>
                    <span class="nav-label">YT Music</span>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="external-arrow" aria-hidden="true">
                        <path d="M5 12h14M13 6l6 6-6 6"/>
                    </svg>
                </a>
            </div>
        </header>

        <!-- Custom Minimal Frosted Glass Music Player Pill -->
        <div class="player-pill" id="playerPill">
            
            <!-- Spinning Vinyl / CD Disc Artwork -->
            <div class="player-art-wrap cd-disc" id="cdDisc">
                <div class="cd-grooves"></div>
                <img src="assets/images/covers/pink_lips.jpg" alt="Song Artwork" class="player-art-img" id="playerArtImg">
                <div class="cd-center-hole"></div>
            </div>

            <!-- Middle: Song Name, Artist, Progress Bar, Time -->
            <div class="player-center">
                <div class="player-text">
                    <h2 class="song-title" id="songTitle">Pink Lips</h2>
                    <p class="song-artist" id="songArtist">Meet Bros Anjjan, Khushboo Grewal</p>
                </div>

                <div class="timeline-container">
                    <div class="progress-bar-wrap" id="progressBarWrap" role="slider" aria-label="Seek time" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                        <div class="progress-track">
                            <div class="progress-fill" id="progressFill"></div>
                            <div class="progress-dot" id="progressDot"></div>
                        </div>
                    </div>
                    <div class="time-label" id="timeLabel">0:00 / 0:00</div>
                </div>
            </div>

            <!-- Right: Controls (Previous, Play/Pause, Next) -->
            <div class="player-controls">
                <button type="button" class="btn-ctrl" id="btnPrev" title="Previous Track (P / ←)" aria-label="Previous track">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
                    </svg>
                </button>

                <button type="button" class="btn-play" id="btnPlay" title="Play / Pause (Space)" aria-label="Play / Pause">
                    <svg viewBox="0 0 24 24" fill="currentColor" id="iconPlay">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                    <svg viewBox="0 0 24 24" fill="currentColor" id="iconPause" style="display:none;">
                        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                    </svg>
                </button>

                <button type="button" class="btn-ctrl" id="btnNext" title="Next Track (N / →)" aria-label="Next track">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
                    </svg>
                </button>
            </div>

        </div>
    </div>

    <!-- Hidden Native Audio Element for Full Length Streaming -->
    <audio id="audioPlayer" preload="auto" referrerpolicy="no-referrer"></audio>

    <!-- HUD Feedback Pill (shows action when shortcuts are pressed) -->
    <div class="hud-pill" id="hudPill">
        <span class="hud-icon" id="hudIcon">▶</span>
        <span class="hud-text" id="hudText">Play</span>
    </div>

    <!-- Keyboard Shortcuts Modal Dialog -->
    <div class="modal-backdrop" id="modalBackdrop">
        <div class="shortcuts-modal">
            <div class="modal-header">
                <h3>⌨️ Keyboard Shortcuts</h3>
                <button type="button" class="btn-close-modal" id="btnCloseModal" aria-label="Close modal">✕</button>
            </div>
            <div class="shortcuts-grid">
                <div class="shortcut-item">
                    <kbd>Space</kbd>
                    <span>Play / Pause</span>
                </div>
                <div class="shortcut-item">
                    <kbd>→</kbd> or <kbd>L</kbd>
                    <span>Seek Forward (+5s)</span>
                </div>
                <div class="shortcut-item">
                    <kbd>←</kbd> or <kbd>J</kbd>
                    <span>Seek Backward (-5s)</span>
                </div>
                <div class="shortcut-item">
                    <kbd>N</kbd>
                    <span>Next Song</span>
                </div>
                <div class="shortcut-item">
                    <kbd>P</kbd>
                    <span>Previous Song</span>
                </div>
                <div class="shortcut-item">
                    <kbd>R</kbd>
                    <span>Shuffle / Random Song</span>
                </div>
                <div class="shortcut-item">
                    <kbd>M</kbd>
                    <span>Mute / Unmute</span>
                </div>
                <div class="shortcut-item">
                    <kbd>?</kbd>
                    <span>Toggle Shortcuts Help</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Modern Modular MVC Architecture Entry Point -->
    <script type="module" src="assets/js/main.js"></script>
</body>
</html>
